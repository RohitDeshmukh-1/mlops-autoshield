name: AutoShield CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Train model
        run: python -m src.pipeline

      - name: Gate check
        run: python -c "
          from src.models.trainer import load_model, evaluate_model
          from src.agents.gate_agent import gate_decision_rules
          from src.data.loader import load_raw_data, preprocess, split_and_scale
          import json
          df = load_raw_data()
          df = preprocess(df)
          _, X_test, _, y_test, _, _ = split_and_scale(df)
          model = load_model('model')
          metrics = evaluate_model(model, X_test, y_test)
          decision = gate_decision_rules(metrics)
          print(json.dumps(decision, indent=2))
          assert decision['decision'] == 'APPROVE', f'Gate BLOCKED: {decision}'
          "
